<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">AuctionHub — Login</h3>
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required/>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Password" required/>
              </div>
              <div id="error-msg" class="alert alert-danger d-none"></div>
              <button type="submit" class="btn btn-dark w-100" id="login-btn">Login</button>
            </form>
            <hr/>
            <p class="text-center mb-0">Don't have an account? <a href="register.html">Register here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) redirectByRole(getUserRole());

    document.addEventListener("DOMContentLoaded", () => {
      renderNav();
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn      = document.getElementById("login-btn");
        const errEl    = document.getElementById("error-msg");

        btn.disabled = true;
        btn.textContent = "Logging in...";
        errEl.classList.add("d-none");

        try {
          const user = await login(email, password);
          showToast("Login successful! Redirecting...", "success");
          setTimeout(() => redirectByRole(user.role), 800);
        } catch (err) {
          errEl.textContent = err.message || "Login failed. Please check credentials.";
          errEl.classList.remove("d-none");
          btn.disabled = false;
          btn.textContent = "Login";
        }
      });
    });
  </script>
</body>
</html>
