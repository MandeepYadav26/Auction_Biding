<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auction Bids — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="seller-dashboard.html" class="btn btn-sm btn-outline-secondary">← Back</a>
      <h4 class="fw-bold mb-0" id="page-title">Auction Bids</h4>
    </div>

    <!-- Auction Summary -->
    <div id="auction-summary" class="card mb-4 d-none">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <h5 id="sum-title">—</h5>
            <p id="sum-status" class="mb-1">—</p>
            <p class="text-muted small mb-0">Ends: <span id="sum-end">—</span></p>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="text-muted small">Starting Price</div>
            <div class="fs-5 fw-bold" id="sum-start-price">—</div>
            <div class="text-muted small mt-1">Current Bid</div>
            <div class="fs-4 fw-bold text-success" id="sum-current-bid">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bids table -->
    <h5 class="section-title">📋 All Bids</h5>
    <div id="bids-container">
      <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
    </div>
  </div>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2025 AuctionHub</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const auctionId = params.get("id");
    if (!auctionId) window.location.href = "seller-dashboard.html";

    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth("seller")) return;
      renderNav();
      await loadAuctionDetail();
      await loadBids();
    });

    async function loadAuctionDetail() {
      try {
        const a = await PublicAPI.getAuction(auctionId);
        document.getElementById("page-title").textContent = `Bids: ${a.title}`;
        document.getElementById("sum-title").textContent = a.title;
        document.getElementById("sum-status").innerHTML = statusBadge(a.status);
        document.getElementById("sum-end").textContent = formatDate(a.end_time);
        document.getElementById("sum-start-price").textContent = formatCurrency(a.starting_price);
        document.getElementById("sum-current-bid").textContent = a.current_bid != null ? formatCurrency(a.current_bid) : "No bids";
        document.getElementById("auction-summary").classList.remove("d-none");
      } catch (_) {}
    }

    async function loadBids() {
      const container = document.getElementById("bids-container");
      try {
        const bids = await SellerAPI.getAuctionBids(auctionId);
        if (!bids.length) {
          container.innerHTML = `<p class="text-muted text-center p-4">No bids placed on this auction yet.</p>`;
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-sm table-striped bid-history-table">
              <thead class="table-dark">
                <tr>
                  <th>#</th>
                  <th>Bidder</th>
                  <th>Amount</th>
                  <th>Type</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody>
                ${bids.map((b, i) => `
                  <tr ${i === 0 ? 'class="table-success"' : ""}>
                    <td>${i + 1}</td>
                    <td>${b.bidder_name || "Bidder #" + b.bidder_id}${i === 0 ? ' <span class="badge bg-success">🏆 Highest</span>' : ""}</td>
                    <td class="fw-bold">${formatCurrency(b.amount)}</td>
                    <td><span class="badge bg-secondary">${b.bid_type || "manual"}</span></td>
                    <td>${formatDate(b.created_at)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
