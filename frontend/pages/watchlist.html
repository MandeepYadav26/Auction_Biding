<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watchlist — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4">
    <h4 class="fw-bold mb-3">❤️ My Watchlist</h4>
    <div id="watchlist-container">
      <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
    </div>
  </div>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2025 AuctionHub</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth("bidder")) return;
      renderNav();
      await loadWatchlist();
    });

    async function loadWatchlist() {
      const container = document.getElementById("watchlist-container");
      try {
        const items = await BidderAPI.getWatchlist();
        if (!items.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">❤️</div>
              <h5>Your watchlist is empty</h5>
              <p>Add auctions to your watchlist from the <a href="auction-list.html">auction listing page</a>.</p>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="row g-3">
            ${items.map(item => `
              <div class="col-sm-6 col-lg-4" id="watch-${item.auction_id}">
                <div class="card auction-card h-100">
                  <div class="card-body">
                    <h6 class="fw-bold">${item.auction_title || "Auction"}</h6>
                    <div class="current-bid mb-1">${item.current_bid != null ? formatCurrency(item.current_bid) : "No bids"}</div>
                    <div class="mb-2">
                      <span class="countdown small" data-end="${item.end_time}">⏳</span>
                      ${statusBadge(item.status || "active")}
                    </div>
                    <div class="d-flex gap-2 mt-2">
                      <a href="auction-detail.html?id=${item.auction_id}" class="btn btn-sm btn-dark flex-fill">View</a>
                      <button class="btn btn-sm btn-outline-danger" onclick="removeFromWatchlist(${item.auction_id})">Remove</button>
                    </div>
                  </div>
                </div>
              </div>`).join("")}
          </div>`;

        // Start countdowns
        document.querySelectorAll(".countdown[data-end]").forEach(el => {
          const end = el.dataset.end;
          const update = () => { el.textContent = formatCountdown(end); };
          update();
          setInterval(update, 1000);
        });
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    async function removeFromWatchlist(auctionId) {
      try {
        await BidderAPI.removeFromWatchlist(auctionId);
        document.getElementById(`watch-${auctionId}`).remove();
        showToast("Removed from watchlist.", "info");
      } catch (err) {
        showToast("❌ " + err.message, "danger");
      }
    }
  </script>
</body>
</html>
