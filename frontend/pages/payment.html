<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment and Invoice — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4" style="max-width:700px">
    <div id="page-container">
      <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
    </div>
  </div>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2025 AuctionHub</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const params    = new URLSearchParams(window.location.search);
    const wonId     = params.get("won_id");
    const invoiceId = params.get("invoice_id");

    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth("bidder")) return;
      renderNav();
      if (invoiceId)    await loadInvoice(invoiceId);
      else if (wonId)   await loadPaymentForm(wonId);
      else              window.location.href = "won-auctions.html";
    });

    async function loadPaymentForm(wId) {
      const container = document.getElementById("page-container");
      container.innerHTML = `
        <div class="card shadow">
          <div class="card-body p-4">
            <h4 class="mb-4">Complete Payment</h4>
            <form id="payment-form">
              <div class="mb-3">
                <label class="form-label fw-bold">Delivery Address *</label>
                <textarea class="form-control" id="delivery-address" rows="3"
                  placeholder="Enter your complete delivery address..." required></textarea>
              </div>
              <div class="alert alert-info">
                <strong>Note:</strong> This is a simulated payment — no real money is charged.
              </div>
              <div id="pay-error" class="alert alert-danger d-none"></div>
              <button type="submit" class="btn btn-success w-100 btn-lg">Confirm Payment</button>
            </form>
          </div>
        </div>`;

      document.getElementById("payment-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const address = document.getElementById("delivery-address").value.trim();
        const btn     = e.target.querySelector("button[type=submit]");
        const errEl   = document.getElementById("pay-error");
        btn.disabled = true; btn.textContent = "Processing...";
        errEl.classList.add("d-none");
        try {
          const result = await BidderAPI.makePayment(wId, address);
          showToast("Payment successful!", "success");
          setTimeout(() => {
            window.location.href = `payment.html?invoice_id=${result.won_auction_id || wId}`;
          }, 1000);
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove("d-none");
          btn.disabled = false;
          btn.textContent = "Confirm Payment";
        }
      });
    }

    async function loadInvoice(iId) {
      const container = document.getElementById("page-container");
      try {
        const inv = await BidderAPI.getInvoice(iId);
        container.innerHTML = `
          <div class="card shadow" id="invoice-card">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                  <h3 class="fw-bold mb-0">AuctionHub</h3>
                  <small class="text-muted">University Project — Auction Platform</small>
                </div>
                <div class="text-end">
                  <h5 class="fw-bold text-muted">INVOICE</h5>
                  <div class="fs-5 fw-bold">${inv.invoice_number}</div>
                  <small class="text-muted">${formatDate(inv.created_at)}</small>
                </div>
              </div>
              <hr/>
              <div class="row mb-4">
                <div class="col-md-6">
                  <p class="text-muted mb-1"><strong>Bill To:</strong></p>
                  <p class="mb-1">${inv.buyer_name || "—"}</p>
                  <p class="mb-0 small">${inv.delivery_address || "—"}</p>
                </div>
                <div class="col-md-6 text-md-end">
                  <p class="text-muted mb-1"><strong>Auction:</strong></p>
                  <p class="mb-1">${inv.auction_title || "—"}</p>
                  <p class="mb-0 small text-muted">Seller: ${inv.seller_name || "—"}</p>
                </div>
              </div>
              <table class="table">
                <thead class="table-light">
                  <tr><th>Description</th><th class="text-end">Amount</th></tr>
                </thead>
                <tbody>
                  <tr><td>Winning Bid — ${inv.auction_title || "Auction"}</td><td class="text-end">${formatCurrency(inv.amount)}</td></tr>
                </tbody>
                <tfoot>
                  <tr class="fw-bold"><td>Total</td><td class="text-end fs-5 text-success">${formatCurrency(inv.amount)}</td></tr>
                </tfoot>
              </table>
              <div class="text-center mt-2">
                <span class="badge bg-success fs-6">PAID</span>
              </div>
              <hr/>
              <p class="text-muted text-center small mb-0">Thank you for using AuctionHub! This is a simulated invoice.</p>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3 justify-content-center">
            <button class="btn btn-dark" onclick="window.print()">Print Invoice</button>
            <a href="won-auctions.html" class="btn btn-outline-secondary">Back to Won Auctions</a>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
