<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bids — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4">
    <h4 class="fw-bold mb-3">📋 My Bids</h4>
    <div id="bids-container">
      <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
    </div>
  </div>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2025 AuctionHub</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth("bidder")) return;
      renderNav();
      await loadMyBids();
    });

    async function loadMyBids() {
      const container = document.getElementById("bids-container");
      try {
        const bids = await BidderAPI.getMyBids();
        if (!bids.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📭</div>
              <h5>No bids yet</h5>
              <p><a href="auction-list.html">Browse auctions</a> and place your first bid!</p>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Auction</th>
                  <th>Your Bid</th>
                  <th>Current Bid</th>
                  <th>Status</th>
                  <th>Winning?</th>
                  <th>Ends</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${bids.map(b => `
                  <tr>
                    <td><strong>${b.auction_title || "Auction #" + b.auction_id}</strong></td>
                    <td>${formatCurrency(b.amount)}</td>
                    <td>${b.current_bid != null ? formatCurrency(b.current_bid) : "—"}</td>
                    <td>${statusBadge(b.auction_status || "active")}</td>
                    <td>
                      ${b.is_winning
                        ? '<span class="badge bg-success">🏆 Winning</span>'
                        : '<span class="badge bg-danger">❌ Outbid</span>'}
                    </td>
                    <td><small>${formatDate(b.auction_end_time)}</small></td>
                    <td>
                      <a href="auction-detail.html?id=${b.auction_id}" class="btn btn-sm btn-outline-dark">View</a>
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
