<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Auction — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4" style="max-width:700px">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="seller-dashboard.html" class="btn btn-sm btn-outline-secondary">Back</a>
      <h4 class="fw-bold mb-0">Create New Auction</h4>
    </div>

    <div class="card shadow">
      <div class="card-body p-4">
        <form id="create-form">
          <div class="mb-3">
            <label class="form-label fw-bold">Auction Title *</label>
            <input type="text" class="form-control" id="title" placeholder="e.g. Vintage Watch 1950s" required minlength="5"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea class="form-control" id="description" rows="3" placeholder="Describe the item..."></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Starting Bid (Rs.) *</label>
              <input type="number" class="form-control" id="starting_bid" placeholder="100.00" min="1" step="0.01" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Reserve Price (Rs.)</label>
              <input type="number" class="form-control" id="reserve_price" placeholder="Optional minimum to sell" min="0" step="0.01"/>
              <small class="text-muted">Item won't sell below this price.</small>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label fw-bold">Buy It Now Price (Rs.)</label>
              <input type="number" class="form-control" id="buy_it_now_price" placeholder="Optional instant buy" min="0" step="0.01"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Min Increment (Rs.)</label>
              <input type="number" class="form-control" id="minimum_increment" value="50" min="1" step="0.01"/>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label fw-bold">Condition *</label>
              <select class="form-select" id="condition" required>
                <option value="new">New</option>
                <option value="like_new" selected>Like New</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="poor">Poor</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Category *</label>
              <select class="form-select" id="category_id" required>
                <option value="">Select category...</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label fw-bold">Start Time *</label>
              <input type="datetime-local" class="form-control" id="start_time" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">End Time *</label>
              <input type="datetime-local" class="form-control" id="end_time" required/>
            </div>
          </div>

          <div id="form-error" class="alert alert-danger mt-3 d-none"></div>
          <div id="form-success" class="alert alert-success mt-3 d-none"></div>
          <button type="submit" class="btn btn-dark w-100 mt-3 btn-lg" id="submit-btn">
            Submit Auction for Approval
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2025 AuctionHub</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!requireAuth("seller")) return;
      renderNav();
      await loadCategories();

      const now = new Date();
      now.setMinutes(now.getMinutes() + 5);
      document.getElementById("start_time").value = toLocalDatetimeInput(now);
      const end = new Date(); end.setDate(end.getDate() + 7);
      document.getElementById("end_time").value = toLocalDatetimeInput(end);

      document.getElementById("create-form").addEventListener("submit", handleSubmit);
    });

    function toLocalDatetimeInput(date) {
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 16);
    }

    async function loadCategories() {
      try {
        const cats = await PublicAPI.getCategories();
        const sel = document.getElementById("category_id");
        cats.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.id; opt.textContent = c.name;
          sel.appendChild(opt);
        });
      } catch (_) {}
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn   = document.getElementById("submit-btn");
      const errEl = document.getElementById("form-error");
      const sucEl = document.getElementById("form-success");
      btn.disabled = true; btn.textContent = "Submitting...";
      errEl.classList.add("d-none"); sucEl.classList.add("d-none");

      const data = {
        title:             document.getElementById("title").value.trim(),
        description:       document.getElementById("description").value.trim(),
        condition:         document.getElementById("condition").value,
        starting_bid:      parseFloat(document.getElementById("starting_bid").value),
        reserve_price:     parseFloat(document.getElementById("reserve_price").value) || null,
        buy_it_now_price:  parseFloat(document.getElementById("buy_it_now_price").value) || null,
        minimum_increment: parseFloat(document.getElementById("minimum_increment").value) || 50,
        category_id:       parseInt(document.getElementById("category_id").value),
        start_time:        new Date(document.getElementById("start_time").value).toISOString(),
        end_time:          new Date(document.getElementById("end_time").value).toISOString(),
      };

      try {
        const result = await SellerAPI.createAuction(data);
        sucEl.textContent = `Auction "${result.title}" submitted! Waiting for admin approval.`;
        sucEl.classList.remove("d-none");
        btn.textContent = "Submitted!";
        setTimeout(() => window.location.href = "seller-dashboard.html", 2000);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("d-none");
        btn.disabled = false;
        btn.textContent = "Submit Auction for Approval";
      }
    }
  </script>
</body>
</html>
