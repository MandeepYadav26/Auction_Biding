<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auction Detail — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <div id="main-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-4" id="detail-container">
    <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
  </div>

  <footer class="text-center">
    <div class="container"><p class="mb-0">© 2025 AuctionHub</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const auctionId = params.get("id");

    if (!auctionId) window.location.href = "auction-list.html";

    let auction = null;
    let countdownInterval = null;

    document.addEventListener("DOMContentLoaded", async () => {
      renderNav();
      await loadAuction();
    });

    async function loadAuction() {
      try {
        auction = await PublicAPI.getAuction(auctionId);
        renderDetail();
        await loadBidHistory();
        startCountdown();
      } catch (err) {
        document.getElementById("detail-container").innerHTML =
          `<div class="alert alert-danger">Failed to load auction: ${err.message}</div>`;
      }
    }

    function renderDetail() {
      const a = auction;
      const user = getUser();
      const isActive = a.status === "approved" || a.status === "active";
      const isEnded  = a.status === "ended" || a.status === "sold";

      const currentBid = a.current_bid != null ? formatCurrency(a.current_bid) : formatCurrency(a.starting_price);
      const minNextBid = a.current_bid != null
        ? formatCurrency(Number(a.current_bid) + Number(a.min_bid_increment || 1))
        : formatCurrency(a.starting_price);

      // Watchlist button (bidders only)
      const watchBtn = (user && user.role === "bidder")
        ? `<button class="btn btn-outline-secondary btn-sm" id="watchlist-btn" onclick="toggleWatchlist()">
             ❤️ Add to Watchlist
           </button>`
        : "";

      // BIN button
      const binBtn = (isActive && a.buy_it_now_price && user && user.role === "bidder")
        ? `<button class="btn btn-warning w-100 mt-2" onclick="doBuyItNow()">
             ⚡ Buy It Now — ${formatCurrency(a.buy_it_now_price)}
           </button>`
        : "";

      // Bid form (bidders only, active auctions)
      let bidSection = "";
      if (isActive && user && user.role === "bidder") {
        bidSection = `
          <div class="mt-3">
            <label class="form-label fw-bold">Place a Bid</label>
            <div class="input-group">
              <span class="input-group-text">₹</span>
              <input type="number" class="form-control" id="bid-amount" 
                     placeholder="Min: ${minNextBid}" min="${a.current_bid || a.starting_price}" step="0.01"/>
              <button class="btn btn-success" onclick="placeBid()">Bid Now</button>
            </div>
            <small class="text-muted">Minimum bid: ${minNextBid}</small>
          </div>

          <div class="mt-3">
            <label class="form-label fw-bold">🤖 Set Proxy Bid (Auto-bidding)</label>
            <div class="input-group">
              <span class="input-group-text">₹</span>
              <input type="number" class="form-control" id="proxy-amount" 
                     placeholder="Your maximum amount" step="0.01"/>
              <button class="btn btn-outline-primary" onclick="setProxyBid()">Set Proxy</button>
            </div>
            <small class="text-muted">System will bid on your behalf up to your max.</small>
          </div>`;
      } else if (!user) {
        bidSection = `
          <div class="alert alert-info mt-3">
            <a href="../login.html">Login</a> or <a href="../register.html">register</a> to place a bid.
          </div>`;
      } else if (isEnded) {
        bidSection = `<div class="alert alert-secondary mt-3">⏰ This auction has ended.</div>`;
      }

      document.getElementById("detail-container").innerHTML = `
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="auction-list.html">Auctions</a></li>
            <li class="breadcrumb-item active">${a.title}</li>
          </ol>
        </nav>

        <div class="row g-4">
          <!-- Left: Image & Info -->
          <div class="col-lg-7">
            <div class="bg-light rounded d-flex align-items-center justify-content-center mb-3" style="height:300px;font-size:5rem;">
              🏷️
            </div>
            <h3 class="fw-bold">${a.title}</h3>
            <p class="text-muted">${a.description || "No description provided."}</p>
            <table class="table table-sm">
              <tbody>
                <tr><td class="text-muted">Category</td><td>${a.category_name || "—"}</td></tr>
                <tr><td class="text-muted">Seller</td><td>${a.seller_name || "—"}</td></tr>
                <tr><td class="text-muted">Start Time</td><td>${formatDate(a.start_time)}</td></tr>
                <tr><td class="text-muted">End Time</td><td>${formatDate(a.end_time)}</td></tr>
                <tr><td class="text-muted">Status</td><td>${statusBadge(a.status)}</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Right: Bid Box -->
          <div class="col-lg-5">
            <div class="detail-price-box mb-3">
              <div class="price-label">Current Bid</div>
              <div class="price-value">${currentBid}</div>
              <div class="text-muted small">Starting price: ${formatCurrency(a.starting_price)}</div>
              <div class="mt-2">
                <span class="countdown-badge" id="live-countdown">⏳ Loading...</span>
              </div>
            </div>

            ${watchBtn}
            ${binBtn}
            ${bidSection}
          </div>
        </div>

        <!-- Bid History -->
        <div class="mt-5">
          <h5 class="section-title">📋 Bid History</h5>
          <div id="bid-history-container">
            <div class="loading-overlay"><div class="spinner-border text-secondary"></div></div>
          </div>
        </div>`;
    }

    async function loadBidHistory() {
      try {
        const bids = await BiddingAPI.getBidHistory(auctionId);
        const container = document.getElementById("bid-history-container");
        if (!bids.length) {
          container.innerHTML = `<p class="text-muted">No bids placed yet. Be the first!</p>`;
          return;
        }
        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-sm table-striped bid-history-table">
              <thead class="table-dark">
                <tr>
                  <th>#</th>
                  <th>Bidder</th>
                  <th>Amount</th>
                  <th>Type</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody>
                ${bids.map((b, i) => `
                  <tr>
                    <td>${i + 1}</td>
                    <td>${b.bidder_name || "Anonymous"}</td>
                    <td class="fw-bold text-success">${formatCurrency(b.amount)}</td>
                    <td><span class="badge bg-secondary">${b.bid_type || "manual"}</span></td>
                    <td>${formatDate(b.created_at)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      } catch (_) {
        document.getElementById("bid-history-container").innerHTML =
          `<p class="text-muted">Could not load bid history.</p>`;
      }
    }

    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      const el = document.getElementById("live-countdown");
      if (!el || !auction) return;
      const update = () => {
        el.textContent = formatCountdown(auction.end_time);
      };
      update();
      countdownInterval = setInterval(update, 1000);
    }

    // ── Actions ───────────────────────────────────────────────

    async function placeBid() {
      if (!requireAuth("bidder")) return;
      const amount = parseFloat(document.getElementById("bid-amount").value);
      if (!amount || amount <= 0) {
        showToast("Please enter a valid bid amount.", "warning");
        return;
      }
      try {
        await BiddingAPI.placeBid(auctionId, amount);
        showToast("✅ Bid placed successfully!", "success");
        await loadAuction();
      } catch (err) {
        showToast("❌ " + err.message, "danger");
      }
    }

    async function setProxyBid() {
      if (!requireAuth("bidder")) return;
      const amount = parseFloat(document.getElementById("proxy-amount").value);
      if (!amount || amount <= 0) {
        showToast("Please enter a valid proxy bid amount.", "warning");
        return;
      }
      try {
        await BiddingAPI.setProxyBid(auctionId, amount);
        showToast("🤖 Proxy bid set! System will bid on your behalf.", "success");
        await loadAuction();
      } catch (err) {
        showToast("❌ " + err.message, "danger");
      }
    }

    async function doBuyItNow() {
      if (!requireAuth("bidder")) return;
      if (!confirm(`Buy this item now for ${formatCurrency(auction.buy_it_now_price)}?`)) return;
      try {
        await BiddingAPI.buyItNow(auctionId);
        showToast("🎉 Purchase successful! Check Won Auctions.", "success");
        await loadAuction();
      } catch (err) {
        showToast("❌ " + err.message, "danger");
      }
    }

    async function toggleWatchlist() {
      if (!requireAuth("bidder")) return;
      try {
        await BidderAPI.addToWatchlist(auctionId);
        showToast("❤️ Added to watchlist!", "success");
        document.getElementById("watchlist-btn").textContent = "❤️ In Watchlist";
      } catch (err) {
        // Maybe already in watchlist — try remove
        try {
          await BidderAPI.removeFromWatchlist(auctionId);
          showToast("💔 Removed from watchlist.", "info");
          document.getElementById("watchlist-btn").textContent = "❤️ Add to Watchlist";
        } catch (e2) {
          showToast("❌ " + err.message, "danger");
        }
      }
    }
  </script>
</body>
</html>
