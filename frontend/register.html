<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — AuctionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">

  <div id="main-nav"></div>

  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">🔨 Create Account</h3>

            <form id="register-form">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="John Doe" required minlength="2"/>
              </div>
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required/>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6"/>
              </div>
              <div class="mb-3">
                <label class="form-label">Role</label>
                <select class="form-select" id="role" required>
                  <option value="">Select your role</option>
                  <option value="bidder">Bidder — I want to bid on auctions</option>
                  <option value="seller">Seller — I want to sell items</option>
                </select>
              </div>
              <div id="error-msg" class="alert alert-danger d-none"></div>
              <div id="success-msg" class="alert alert-success d-none"></div>
              <button type="submit" class="btn btn-dark w-100" id="reg-btn">
                Create Account
              </button>
            </form>

            <hr/>
            <p class="text-center mb-0">
              Already have an account? <a href="login.html">Login here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) {
      redirectByRole(getUserRole());
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderNav();

      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name     = document.getElementById("name").value.trim();
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const role     = document.getElementById("role").value;
        const btn      = document.getElementById("reg-btn");
        const errEl    = document.getElementById("error-msg");
        const sucEl    = document.getElementById("success-msg");

        btn.disabled = true;
        btn.textContent = "Creating account...";
        errEl.classList.add("d-none");
        sucEl.classList.add("d-none");

        try {
          await AuthAPI.register(name, email, password, role);
          sucEl.textContent = "Account created! Logging you in...";
          sucEl.classList.remove("d-none");

          // Auto-login after registration
          const user = await login(email, password);
          setTimeout(() => redirectByRole(user.role), 1000);
        } catch (err) {
          errEl.textContent = err.message || "Registration failed. Please try again.";
          errEl.classList.remove("d-none");
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      });
    });
  </script>
</body>
</html>
